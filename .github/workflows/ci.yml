name: Check Commit CI

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
  
concurrency:
  group: environment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    env:
      KEYSTORE_FILE: ${{secrets.KEYSTORE_FILE}}
      KEYSTORE_KEY_ALIAS: ${{secrets.KEYSTORE_KEY_ALIAS}}
      KEYSTORE_KEY_PASSWORD: ${{secrets.KEYSTORE_KEY_PASSWORD}}
      KEYSTORE_STORE_PASSWORD: ${{secrets.KEYSTORE_STORE_PASSWORD}}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      
      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: cache gradle dependencies
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('/*.gradle*', '/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: cache gradle wrapper
        uses: actions/cache@v3
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          
      - name: make gradlew executable
        run: chmod +x ./gradlew

      - name: build debug artifact
        run: ./gradlew app:assembleDebug

      - name: upload artifacts to outputs
        uses: actions/upload-artifact@v4
        with:
          path: |
            app/build/outputs/apk

      - name: Run printVersionName task and capture output
        id: version_name
        run: |
          VERSION_NAME=$(./gradlew printVersionName -q)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Display version name
        run: echo "The application version name is $VERSION_NAME"

      - name: send telegram message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          disable_notification: false
          disable_web_page_preview: true
          message: |
            ✅ *$$VERSION_NAME({$VERSION_NAME})*
            *Ветка:* ${{ github.ref_name }}
            *Коммит:* ${{ github.sha }}
          document: app/build/outputs/apk/**/*.apk